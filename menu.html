<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barbería - Panel de Control</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="bg-custom">
    <div class="container mt-5">
        <h1 class="text-center text-gold mb-5">
            <i class="fa fa-scissors"></i> GESTIÓN DE BARBERÍA
        </h1>
        <div class="row g-4 justify-content-center">
            
            <!-- Barberos -->
            <div class="col-md-4 col-lg-2">
                <div class="card card-barber text-center p-4 h-100 shadow-lg">
                    <i class="fa fa-user-secret fa-4x mb-3 text-gold"></i>
                    <h4>Barberos</h4>
                    <p class="small text-light">Gestión de personal.</p>
                    <a href="html/barberos.html" class="btn btn-gold fw-bold mt-auto">ENTRAR</a>
                </div>
            </div>

            <!-- Clientes -->
            <div class="col-md-4 col-lg-2">
                <div class="card card-barber text-center p-4 h-100 shadow-lg">
                    <i class="fa fa-users fa-4x mb-3 text-gold"></i>
                    <h4>Clientes</h4>
                    <p class="small text-light">Base de datos.</p>
                    <a href="html/clientes.html" class="btn btn-gold fw-bold mt-auto">ENTRAR</a>
                </div>
            </div>

            <!-- Servicios -->
            <div class="col-md-4 col-lg-2">
                <div class="card card-barber text-center p-4 h-100 shadow-lg">
                    <i class="fa fa-list-alt fa-4x mb-3 text-gold"></i>
                    <h4>Servicios</h4>
                    <p class="small text-light">Tarifas y catálogo.</p>
                    <a href="html/servicios.html" class="btn btn-gold fw-bold mt-auto">ENTRAR</a>
                </div>
            </div>

            <!-- Citas -->
            <div class="col-md-4 col-lg-2">
                <div class="card card-barber text-center p-4 h-100 shadow-lg">
                    <i class="fa fa-calendar-check-o fa-4x mb-3 text-gold"></i>
                    <h4>Citas</h4>
                    <p class="small text-light">Agenda de turnos.</p>
                    <a href="html/citas.html" class="btn btn-gold fw-bold mt-auto">ENTRAR</a>
                </div>
            </div>

            <!-- Ventas (Añadido para completar tu app.js) -->
            <div class="col-md-4 col-lg-2">
                <div class="card card-barber text-center p-4 h-100 shadow-lg">
                    <i class="fa fa-money fa-4x mb-3 text-gold"></i>
                    <h4>Ventas</h4>
                    <p class="small text-light">Ingresos y pagos.</p>
                    <a href="html/ventas.html" class="btn btn-gold fw-bold mt-auto">ENTRAR</a>
                </div>
            </div>

        </div>
    </div>
</body>
</html>
